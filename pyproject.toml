[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-computer-class"
version = "0.6.0"
description = "Safe Computer Class - School network access control system"
authors = [
    {name = "SCC Team"}
]
dependencies = [
    "flask>=2.0.0",
    "pyserial>=3.5",
    "pyqt6>=6.0.0",
    "cryptography>=3.4.0",
    "pydantic>=1.8.0"
]
requires-python = ">=3.8"

[project.scripts]
scc = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]